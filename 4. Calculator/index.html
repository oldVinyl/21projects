<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <h2>Now, why haven't i done this yet</h2>
    <div class="display"></div>
    <div class="clear">
        <button>Clear</button>
    </div>
    <div class="buttons">
        <div class="numbers">
            <button>0</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
        </div>
        <div class="operations">
            <button class="plus">+</button>
            <button class="minus">-</button>
            <button class="multiply">*</button>
            <button class="divide">/</button>
            <button class="equals">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
