<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <h2>Now, why haven't i done this yet</h2>
    <div class="display"></div>
    <div class="clear">
        <button>Clear</button>
    </div>
    <div class="buttons">
        <div class="numbers">
            <button class="1">0</button>
            <button class="2">1</button>
            <button class="3">2</button>
            <button class="4">3</button>
            <button class="5">4</button>
            <button class="6">5</button>
            <button class="7">6</button>
            <button class="8">7</button>
            <button class="9">8</button>
            <button class="10">9</button>
        </div>
        <div class="operations">
            <button class="plus">+</button>
            <button class="minus">-</button>
            <button class="multiply">*</button>
            <button class="divide">/</button>
            <button class="equals">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
